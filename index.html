<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-dark bg-black mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">MOVIE WATCHLIST 🎬</a>
            <button type="button" id="randomBtn" class="btn btn-warning fw-bold">
                🎲 What Should I watch tonight?
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="row text-center mb-4">
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3 bg-secondary text-white">
                    <h5>Number of Movies</h5>
                    <h3 id="totalMovies" class="fw-bold">0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3 bg-secondary text-white">
                    <h5>Watched</h5>
                    <h3 id="watchedMovies" class="fw-bold text-info">0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3 bg-secondary text-white">
                    <h5>Average Rating</h5>
                    <h3 id="avgRating" class="fw-bold text-warning">0.0</h3>
                </div>
            </div>
        </div>

        <div class="card bg-secondary text-white p-4 mb-4 shadow">
            <h4 class="mb-3">Add a New Movie</h4>
            <form id="Form" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Movie Title</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. Inception">
                        <div id="errorMsg" class="text-danger bg-white px-2 mt-1 rounded fw-bold small"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="movieGenre" class="form-label">Genre</label>
                        <select id="movieGenre" class="form-select">
                            <option value="" selected disabled>Choose Genre...</option>
                            <option value="Action">Action</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Romance">Romance</option>
                            <option value="Drama">Drama</option>
                            <option value="Horror">Horror</option>
                        </select>
                        <div id="genreError" class="text-danger bg-white px-2 mt-1 rounded fw-bold small"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="movieYear" class="form-label" id="yearLabel">Year (1900 - 2026)</label>
                        <input type="number" id="movieYear" class="form-control" placeholder="e.g. 2010">
                        <div id="yearError" class="text-danger bg-white px-2 mt-1 rounded fw-bold small"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="movieRating" class="form-label">Rating</label>
                        <select id="movieRating" class="form-select">
                            <option value="" selected disabled>Choose Rating...</option>
                            <option value="1">⭐ 1</option>
                            <option value="2">⭐⭐ 2</option>
                            <option value="3">⭐⭐⭐ 3</option>
                            <option value="4">⭐⭐⭐⭐ 4</option>
                            <option value="5">⭐⭐⭐⭐⭐ 5</option>
                        </select>
                        <div id="ratingError" class="text-danger bg-white px-2 mt-1 rounded fw-bold small"></div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Add Movie</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search by title...">
            </div>
            <div class="col-md-4">
                <select id="filterGenre" class="form-select">
                    <option value="All">All Genres</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Romance">Romance</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="sortSelect" class="form-select">
                    <option value="default">Sort By: Default</option>
                    <option value="rating-desc">Rating: High to Low</option>
                    <option value="rating-asc">Rating: Low to High</option>
                    <option value="year-desc">Year: Newest First</option>
                    <option value="year-asc">Year: Oldest First</option>
                </select>
            </div>
        </div>

        <div id="moviesShown"  class="grid-container"></div>
    </div>

    <script src="./app.js" defer></script>
</body>
</html>
